name: macOS UI tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run package tests
        run: swift test --package-path SundownKit

      - name: Run app UI tests
        run: |
          xcodebuild test \
            -project Sundown.xcodeproj \
            -scheme Sundown \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/SundownDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/SundownUITests.xcresult" \
            -parallel-testing-enabled NO \
            -skip-testing:SundownAppUITests/SundownPerformanceUITests \
            SUNDOWN_APP_BUNDLE_IDENTIFIER=com.haydenhong.SundownUITestFixture \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SundownUITests-xcresult
          path: ${{ runner.temp }}/SundownUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
