name: macOS UI tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run package tests
        run: swift test --package-path TetherKit

      - name: Run app UI tests
        run: |
          xcodebuild test \
            -project Tether.xcodeproj \
            -scheme Tether \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TetherDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TetherUITests.xcresult" \
            -parallel-testing-enabled NO \
            -skip-testing:TetherAppUITests/TetherPerformanceUITests \
            TETHER_APP_BUNDLE_IDENTIFIER=com.haydenhong.TetherUITestFixture \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TetherUITests-xcresult
          path: ${{ runner.temp }}/TetherUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
