name: macOS UI tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      TETHER_SKIP_SERVER_BINARIES: "1"
    steps:
      - uses: actions/checkout@v4

      # SwiftPM resolves the private TetherProtocol package from tether-server.
      # This token needs read-only Contents access to that repository.
      - name: Configure private package access
        env:
          TETHER_SERVER_READ_TOKEN: ${{ secrets.TETHER_SERVER_READ_TOKEN }}
        run: |
          if [[ -z "$TETHER_SERVER_READ_TOKEN" ]]; then
            echo "TETHER_SERVER_READ_TOKEN is required for the private TetherProtocol package" >&2
            exit 1
          fi
          credentials="$RUNNER_TEMP/tether-git-credentials"
          printf 'https://x-access-token:%s@github.com\n' "$TETHER_SERVER_READ_TOKEN" > "$credentials"
          chmod 600 "$credentials"
          git config --global credential.helper "store --file=$credentials"

      - name: Run package tests
        run: swift test --package-path TetherKit

      - name: Run app UI tests
        run: |
          xcodebuild test \
            -project Tether.xcodeproj \
            -scheme Tether \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TetherDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TetherUITests.xcresult" \
            -parallel-testing-enabled NO \
            TETHER_APP_BUNDLE_IDENTIFIER=com.haydenhong.TetherUITestFixture \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TetherUITests-xcresult
          path: ${{ runner.temp }}/TetherUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove private package credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/tether-git-credentials"
