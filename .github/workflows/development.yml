name: Development

# For working on the app without a Mac: builds it, launches it against the in-memory FakeHost
# (SUNDOWN_UI_TEST_MODE=1, no daemon, no network), and saves screenshots and a screen recording.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: SUNDOWN_UI_TEST_SCENARIO (empty for one short chat)
        default: showcase
  push:
    branches: ["claude/**"]

permissions:
  contents: read

jobs:
  app:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      SCENARIO: ${{ inputs.scenario || 'showcase' }}
      SHOTS: ${{ github.workspace }}/screenshots
    steps:
      - uses: actions/checkout@v4

      - name: Build
        timeout-minutes: 15
        run: |
          xcodebuild build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project Sundown.xcodeproj \
            -scheme Sundown \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            SUNDOWN_APP_BUNDLE_IDENTIFIER=com.haydenhong.SundownUITestFixture \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=

      - name: Launch and capture
        timeout-minutes: 5
        run: |
          mkdir -p "$SHOTS"
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug/Sundown.app"
          ls "$app/Contents/MacOS"
          for appearance in light dark; do
            # The app follows the system appearance, so switch the runner's.
            dark=$([ "$appearance" = dark ] && echo true || echo false)
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $dark"
            SUNDOWN_UI_TEST_MODE=1 SUNDOWN_UI_TEST_SCENARIO="$SCENARIO" \
              "$app/Contents/MacOS/Sundown" -ApplePersistenceIgnoreState YES \
              > "$SHOTS/app-$appearance.log" 2>&1 &
            pid=$!
            sleep 15
            osascript -e 'tell application "System Events" to set frontmost of (first process whose unix id is '"$pid"') to true' || true
            sleep 2
            screencapture -x "$SHOTS/screen-$appearance.png"
            kill "$pid" || true
            wait "$pid" 2>/dev/null || true
          done
          ls -la "$SHOTS"

      - name: Record a scripted walkthrough
        timeout-minutes: 5
        run: |
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false'
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug/Sundown.app"
          # StressDriver (Debug builds, fixture mode only) runs these one after another.
          script="$RUNNER_TEMP/walkthrough.txt"
          cat > "$script" <<'EOF'
          wait 3000
          scroll top
          wait 1500
          scroll bottom
          wait 1500
          tab tasks
          wait 2500
          tab diff
          wait 2500
          tab chat
          wait 1500
          chat 0
          wait 3000
          chat 2
          wait 3000
          chat 1
          wait 1500
          send Add a background refresh too.
          wait 6000
          EOF
          sed -i '' 's/^ *//' "$script"
          screencapture -x -V 35 "$SHOTS/walkthrough.mov" &
          rec=$!
          sleep 1
          SUNDOWN_UI_TEST_MODE=1 SUNDOWN_UI_TEST_SCENARIO="$SCENARIO" SUNDOWN_STRESS_FILE="$script" \
            "$app/Contents/MacOS/Sundown" -ApplePersistenceIgnoreState YES \
            > "$SHOTS/app-walkthrough.log" 2>&1 &
          pid=$!
          sleep 3
          osascript -e 'tell application "System Events" to set frontmost of (first process whose unix id is '"$pid"') to true' || true
          # Stills partway through, to compare with the video.
          for t in 8 14 22 30; do (sleep $((t - 4)); screencapture -x "$SHOTS/walkthrough-${t}s.png") & done
          wait "$rec" || true
          /usr/bin/log show --last 3m --info --debug --style compact \
            --predicate 'subsystem == "com.haydenhong.Sundown"' > "$SHOTS/app-os.log" || true
          echo "commands run: $(cat "$script.done" 2>/dev/null || echo none)"
          kill "$pid" || true
          ls -la "$SHOTS"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ env.SHOTS }}
