name: Release

# Merging a version bump releases it. On each push to main, if the app's MARKETING_VERSION has no
# tag yet, this builds, signs with Developer ID, notarizes and publishes it as a GitHub release
# (Scripts/release.sh); the Homebrew tap picks the release up by itself. Any other push stops after
# the first step, on Linux.
#
# Secrets: DEVELOPER_ID_P12 (the Developer ID Application certificate and its key, exported from
# Keychain Access as .p12, base64), DEVELOPER_ID_P12_PASSWORD, and an App Store Connect API key for
# notarizing: NOTARY_KEY (the .p8's contents), NOTARY_KEY_ID, NOTARY_ISSUER.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(grep -m1 'MARKETING_VERSION = ' Tether.xcodeproj/project.pbxproj | sed 's/.*= \(.*\);/\1/')
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Signing and notarizing credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
      - name: Build, notarize and publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: Scripts/release.sh
