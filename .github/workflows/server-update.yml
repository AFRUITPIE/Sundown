name: Server update

# A newly published tether-server (Server/, released by server-release.yml) becomes a pull request:
# ServerRelease.version, the version hosts run with npx, and the app's own patch version, so merging
# it releases the app with that server. Daily, and by hand. Waits for npm's published version, so a
# staged one isn't picked up until it's approved. The protocol's Swift needs no pin: it's built from
# this repository, so the app already has the protocol of the server on main.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin the latest server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(npm view tether-server version)
          current=$(sed -n 's/.*public static let version = "\(.*\)"/\1/p' SundownKit/Sources/SundownKit/Bootstrap.swift)
          branch="tether-server-$latest"
          if [ "$latest" = "$current" ]; then echo "Already on tether-server $current."; exit 0; fi
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then echo "$branch is already open."; exit 0; fi

          sed -i "s/public static let version = \"$current\"/public static let version = \"$latest\"/" SundownKit/Sources/SundownKit/Bootstrap.swift

          # The app's next patch version, and its next build.
          project=Sundown.xcodeproj/project.xcproj
          app=$(sed -n 's/.*"MARKETING_VERSION": "\([^"]*\)".*/\1/p' "$project" | head -1)
          build=$(sed -n 's/.*"CURRENT_PROJECT_VERSION": "\([^"]*\)".*/\1/p' "$project" | head -1)
          next=$(echo "$app" | awk -F. '{ if (NF < 3) print $0 ".1"; else { $NF = $NF + 1; print } }' OFS=.)
          sed -i "s/\"MARKETING_VERSION\": \"$app\"/\"MARKETING_VERSION\": \"$next\"/; s/\"CURRENT_PROJECT_VERSION\": \"$build\"/\"CURRENT_PROJECT_VERSION\": \"$((build + 1))\"/" "$project"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Use tether-server $latest, as Sundown $next"
          git push origin "$branch"
          gh pr create --head "$branch" --title "Use tether-server $latest" \
            --body "tether-server $latest is on npm. This makes it the server hosts run (\`ServerRelease.version\`) and makes the app $next, so merging it releases the app with that server."
          # A pull request this workflow's token opens starts no other workflows, so its tests are
          # started by hand; they report on the branch's commit, which the PR shows.
          gh workflow run tests.yml --ref "$branch"
          gh workflow run release-check.yml --ref "$branch"
