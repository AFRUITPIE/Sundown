name: Server Release

# Merging a server version bump releases it to npm. On each push to main, if Server/package.json's
# version isn't on npm and has no `server-v<version>` tag yet, this tests and builds the npm package,
# stages it on npm, then tags that commit `server-v<version>`. Any other push does nothing. The app
# picks a published version up through server-update.yml.
#
# Only a tag, never a GitHub release: this repository's releases are the app's, which the Homebrew
# tap reads, and `v<version>` tags are the app's too.
#
# Staged by trusted publishing: npm takes this workflow's OIDC token instead of a stored one, and
# records where the package was built (provenance). The package's trusted publisher on npmjs.com
# names this repository and this file, and may only stage: a maintainer approves the version with
# 2FA before it's published (`npm stage approve <id>`, or Staged Packages on npmjs.com).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency: server-release

defaults:
  run:
    working-directory: Server

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sdk=$(node -p "require('./package.json').dependencies['@anthropic-ai/claude-agent-sdk']")" >> "$GITHUB_OUTPUT"
          # Versions released before the server moved here have tags only in the old tether-server
          # repository, so npm is asked too.
          if git ls-remote --exit-code --tags origin "refs/tags/server-v$version" > /dev/null \
            || [ "$(npm view "tether-server@$version" version 2>/dev/null)" = "$version" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "tether-server $version is already released."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing and staging need a recent npm; Node 22 comes with npm 10.
      - if: steps.version.outputs.new == 'true'
        run: npm install -g npm@latest
      - if: steps.version.outputs.new == 'true'
        run: bun install --frozen-lockfile
      - if: steps.version.outputs.new == 'true'
        run: bun test
      - if: steps.version.outputs.new == 'true'
        run: bun run scripts/build-npm.ts
      # What npm will serve, run the way a host runs it.
      - if: steps.version.outputs.new == 'true'
        run: node npm/cli.js version --json
      - if: steps.version.outputs.new == 'true'
        run: npm stage publish ./npm --access public
      # Tagged only once npm has it, so a failed run leaves nothing half released and the next
      # push tries again.
      - if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SDK: ${{ steps.version.outputs.sdk }}
        run: |
          git tag "server-v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/server-v$VERSION"
          echo "tether-server $VERSION, built against Claude Agent SDK $SDK, is staged on npm. Approve it there to publish it." >> "$GITHUB_STEP_SUMMARY"
