name: Performance

# The package benchmarks (SundownKit/Tests/SundownUITests/*Benchmark*.swift) on a base commit and
# on the branch this is started on, compared. Started by hand: `gh workflow run performance.yml
# --ref <branch>`, or from the Actions tab.
#
# Both are built in Release in folders of the same shape, then run in interleaved rounds (base,
# branch, base, ...): two runs one after the other on a runner differ by a few percent with the same
# code. The comparison is in the run's summary, in the log between BEGIN-BENCH-JSON and
# END-BENCH-JSON, and in the `benchmarks` artifact (bench.json and every round's log). The runner
# is a virtual machine with no CPU counters, so judge by CPU time, clock time and peak memory.
on:
  # Also on a pull request that changes this workflow or its script, so a change to it is tried.
  pull_request:
    paths: [.github/workflows/performance.yml, Scripts/bench-compare.py]
  workflow_dispatch:
    inputs:
      base:
        description: Commit or branch to compare against (empty for where the branch left main, or the parent on main)
        required: false
      filter:
        description: swift test --filter
        default: Benchmark
      rounds:
        description: Rounds of each
        default: "3"

permissions:
  contents: read

jobs:
  compare:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      FILTER: ${{ inputs.filter || 'Benchmark' }}
      ROUNDS: ${{ inputs.rounds || '3' }}
      SUNDOWN_BENCH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose the base
        env:
          BASE: ${{ inputs.base }}
        run: |
          git fetch -q origin main
          if [ -n "$BASE" ]; then
            git fetch -q origin "$BASE" 2>/dev/null || true
            base=$(git rev-parse --verify "origin/$BASE" 2>/dev/null || git rev-parse --verify "$BASE^{commit}")
          else
            base=$(git merge-base HEAD origin/main)
            [ "$base" != "$(git rev-parse HEAD)" ] || base=$(git rev-parse HEAD~1)
          fi
          echo "Branch $(git rev-parse --short HEAD) against base $(git rev-parse --short "$base")"
          # Same-shaped paths, so neither build differs by where it lives.
          git worktree add -q --detach "$RUNNER_TEMP/a/sundown" "$base"
          git worktree add -q --detach "$RUNNER_TEMP/b/sundown" HEAD
          mkdir -p "$RUNNER_TEMP/bench"

      - name: Build both
        run: |
          for side in a b; do
            swift build -c release --build-tests -Xswiftc -DDEBUG -Xswiftc -enable-testing \
              --package-path "$RUNNER_TEMP/$side/sundown/SundownKit"
          done

      - name: Run interleaved rounds
        run: |
          set -o pipefail
          for round in $(seq "$ROUNDS"); do
            for side in a b; do
              name=$([ $side = a ] && echo base || echo branch)
              echo "::group::Round $round, $name"
              swift test --skip-build -c release -Xswiftc -DDEBUG -Xswiftc -enable-testing \
                --package-path "$RUNNER_TEMP/$side/sundown/SundownKit" --filter "$FILTER" 2>&1 \
                | tee "$RUNNER_TEMP/bench/$name-$round.log" || [ $side = a ]
              echo "::endgroup::"
            done
          done

      - name: Compare
        run: |
          bench="$RUNNER_TEMP/bench"
          python3 Scripts/bench-compare.py "$bench/bench.json" --base "$bench"/base-*.log --branch "$bench"/branch-*.log
          echo BEGIN-BENCH-JSON
          cat "$bench/bench.json"
          echo END-BENCH-JSON

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks
          path: ${{ runner.temp }}/bench
          retention-days: 30
