name: Server CI

# The server in Server/: typecheck, unit tests (including the check that the committed schema and
# the app's Generated.swift match src/protocol), and its compiled binary through the CLI and daemon
# tests, on both kinds of host. The Swift protocol tests run with the app's package tests (tests.yml).
on:
  push:
    branches: [main]
    paths: [Server/**, SundownKit/Sources/ServerProtocol/**, .github/workflows/server-ci.yml]
  pull_request:
    paths: [Server/**, SundownKit/Sources/ServerProtocol/**, .github/workflows/server-ci.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: Server

jobs:
  test:
    name: Server Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Hosts run the server on Linux and macOS.
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Bun at the version Server/mise.toml pins.
      - uses: jdx/mise-action@v5
        with:
          working_directory: Server

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: mise run typecheck

      - name: Test
        run: mise run test

      # The standalone binary for this runner, driven through the same CLI and daemon tests.
      - name: Compile this platform's binary
        run: |
          platform=$(bun -e 'console.log(`${process.platform}-${process.arch}`)')
          version=$(bun -e 'console.log(require("./package.json").version)')
          echo "SUNDOWN_SERVER_TEST_BINARY=dist/sundown-server-$version-$platform" >> "$GITHUB_ENV"
          SUNDOWN_SERVER_TARGETS=$platform mise run compile

      - name: Test the compiled binary
        run: bun test test/cli.test.ts
